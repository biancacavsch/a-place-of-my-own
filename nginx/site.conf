# Configuração para servir o site no Raspberry Pi via Nginx
# Copie este arquivo para: /etc/nginx/sites-available/seu-site
# Depois crie um link: sudo ln -s /etc/nginx/sites-available/seu-site /etc/nginx/sites-enabled/
# E recarregue: sudo nginx -s reload

server {
    # Porta 8080 (CasaOS já usa a 80)
    listen 8080;
    listen [::]:8080;

    # Nome do seu site (mude para seu domínio ou IP)
    server_name 192.168.11.127;

    # Caminho onde estão os arquivos do site
    root /var/www/a-place-of-my-own;
    index index.html;

    # Gzip = compacta arquivos antes de enviar (site mais rápido)
    gzip on;
    gzip_types text/html text/css application/javascript application/json image/svg+xml;

    location / {
        try_files $uri $uri/ =404;
    }

    # Cache de arquivos estáticos (imagens, css, js)
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg)$ {
        expires 7d;
        add_header Cache-Control "public, no-transform";
    }
}