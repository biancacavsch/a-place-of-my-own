#!/usr/bin/sbin/nft -f
# ============================================================
# FIREWALL DO RASPBERRY PI
# ============================================================
# Template didático. As variáveis $XXX são substituídas
# pelo apply.sh a partir do arquivo .env (que tem IPs reais)
# ============================================================

# Apaga tabela se já existir (para permitir re-aplicação)
table inet filter {
    chain input {
        type filter hook input priority 0; policy drop;

        # ============================================
        # 1. CONEXÕES ESTABELECIDAS (volta do que você iniciou)
        # ============================================
        # Se VOCÊ abriu a conexão (ex: SSH, navegar), ela pode voltar.
        # Isso evita ter que liberar cada porta de resposta.
        ct state established,related accept

        # ============================================
        # 2. LOOPBACK (o próprio device se comunicando)
        # ============================================
        # 127.0.0.1 é o próprio Pi. Sempre liberar.
        iif lo accept

        # ============================================
        # 3. ICMP (ping)
        # ============================================
        # Permite que outros dispositivos façam ping no Pi
        # Útil para diagnóstico de rede
        ip protocol icmp accept

        # ============================================
        # 4. SSH (porta 22)
        # ============================================
        # SSH da rede local
        ip saddr $LAN_NETWORK tcp dport 22 accept comment "SSH da LAN"

        # SSH via Tailscale
        ip saddr $TAILSCALE_NETWORK tcp dport 22 accept comment "SSH via Tailscale"

        # ============================================
        # 5. SERVIÇOS WEB (porta 8080 do Nginx)
        # ============================================
        tcp dport { 80, 8080 } accept comment "Site pessoal (Nginx)"

        # ============================================
        # 6. TAILSCALE (porta 41641 UDP)
        # ============================================
        udp dport 41641 accept comment "Tailscale daemon"

        # ============================================
        # 7. PI-HOLE DNS (porta 53)
        # ============================================
        # DNS da rede local (devices da casa)
        ip saddr $LAN_NETWORK udp dport 53 accept comment "Pi-hole DNS LAN"
        ip saddr $LAN_NETWORK tcp dport 53 accept comment "Pi-hole DNS LAN TCP"

        # DNS via Tailscale (devices fora)
        ip saddr $TAILSCALE_NETWORK udp dport 53 accept comment "Pi-hole DNS Tailscale"
        ip saddr $TAILSCALE_NETWORK tcp dport 53 accept comment "Pi-hole DNS Tailscale TCP"

        # DNS local Unbound (resolver no próprio Pi)
        ip saddr 127.0.0.1 udp dport 5335 accept comment "Unbound local"

        # ============================================
        # 8. CONTAINERS VIA TAILSCALE
        # ============================================
        # Trilium Notes (porta 7070)
        ip saddr $TAILSCALE_NETWORK tcp dport 7070 accept comment "Trilium Notes"

        # Pi-hole admin (portas 8800 HTTP, 8443 HTTPS)
        ip saddr $TAILSCALE_NETWORK tcp dport { 8800, 8443 } accept comment "Pi-hole admin"

        # Port Tracker (porta 4999)
        ip saddr $TAILSCALE_NETWORK tcp dport 4999 accept comment "Port Tracker"

        # Nginx web secundário (porta 8085 - nginx-web container)
        ip saddr $TAILSCALE_NETWORK tcp dport 8085 accept comment "Nginx secundário (Tailscale)"

        # ============================================
        # 9. LOG + DROP (final)
        # ============================================
        # Tudo que chegou até aqui é bloqueado, mas logamos
        # Útil para investigar tentativas suspeitas
        log prefix "nftables-drop: " flags all counter drop
    }

    chain output {
        type filter hook output priority 0; policy accept;
        # Tudo o que SAI é permitido (navegar, baixar, etc)
    }
}
