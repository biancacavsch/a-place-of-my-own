#!/usr/bin/sbin/nft -f
# ============================================================
# FIREWALL DO COMPUTADOR LOCAL (debian)
# ============================================================
# Versão SIMPLES: como é um desktop cliente, bloqueamos
# quase tudo que entra (default deny) e só permitimos
# conexões iniciadas por nós + SSH via Tailscale.
# ============================================================

table inet filter {
    chain input {
        type filter hook input priority 0; policy drop;

        # ============================================
        # 1. CONEXÕES ESTABELECIDAS (volta do que você iniciou)
        # ============================================
        # Se VOCÊ abriu a conexão (navegação, download, etc),
        # ela pode voltar. Sem isso, NADA funcionaria.
        ct state established,related accept

        # ============================================
        # 2. LOOPBACK (o próprio device se comunicando)
        # ============================================
        iif lo accept

        # ============================================
        # 3. ICMP (ping)
        # ============================================
        ip protocol icmp accept

        # ============================================
        # 4. SSH via Tailscale (porta 22)
        # ============================================
        # Permite você acessar este PC por SSH via Tailscale
        # (do Pi ou de outro device na rede Tailscale)
        ip saddr $TAILSCALE_NETWORK tcp dport 22 accept comment "SSH via Tailscale"

        # ============================================
        # 5. TAILSCALE (porta 41641 UDP)
        # ============================================
        udp dport 41641 accept comment "Tailscale daemon"

        # ============================================
        # 6. LOG + DROP (final)
        # ============================================
        # Tudo o que não foi liberado acima é bloqueado
        # e logado para investigação
        log prefix "nftables-drop: " flags all counter drop
    }

    chain output {
        type filter hook output priority 0; policy accept;
        # Tudo o que SAI é permitido (navegar, baixar, etc)
    }
}
